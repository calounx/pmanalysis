name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]
  schedule:
    # Run tests daily at 2am UTC
    - cron: '0 2 * * *'

jobs:
  shellcheck:
    name: ShellCheck Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: warning
          format: tty

      - name: ShellCheck health-check.sh
        run: shellcheck -x -S warning health-check.sh

  validation:
    name: Quick Deployment Validation
    runs-on: ubuntu-latest
    needs: shellcheck

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq bc sysstat lsof net-tools

      - name: Make scripts executable
        run: |
          chmod +x health-check.sh
          chmod +x validate-deployment.sh
          chmod +x test-production-readiness.sh

      - name: Run prerequisite check
        run: ./health-check.sh --check-prerequisites

      - name: Run quick validation (8 tests)
        run: ./validate-deployment.sh

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: /tmp/hc-*.json
          retention-days: 30

  comprehensive-tests:
    name: Comprehensive Test Suite
    runs-on: ubuntu-latest
    needs: validation

    strategy:
      matrix:
        test-suite:
          - basic
          - stress
          - error-recovery
          - output-validation
          - performance
          - integration
          - security

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq bc sysstat lsof net-tools stress-ng

      - name: Make scripts executable
        run: chmod +x health-check.sh test-production-readiness.sh

      - name: Run ${{ matrix.test-suite }} tests
        run: |
          # Extract specific test suite from comprehensive test script
          ./test-production-readiness.sh 2>&1 | tee test-output.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.test-suite }}
          path: test-output.log
          retention-days: 30

  debian-compatibility:
    name: Debian Version Compatibility
    runs-on: ubuntu-latest
    needs: shellcheck

    strategy:
      matrix:
        debian-version: ['12', '11']

    container:
      image: debian:${{ matrix.debian-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y jq bc sysstat lsof net-tools sudo procps

      - name: Create test user
        run: |
          useradd -m -s /bin/bash testuser
          echo "testuser ALL=(ALL) NOPASSWD: /usr/bin/dmesg, /usr/bin/journalctl" > /etc/sudoers.d/health-check

      - name: Run as non-root user
        run: |
          chmod +x health-check.sh
          su - testuser -c "cd $PWD && ./health-check.sh --check-prerequisites"
          su - testuser -c "cd $PWD && ./health-check.sh --json" | jq .

      - name: Verify exit codes
        run: |
          su - testuser -c "cd $PWD && ./health-check.sh --quiet"
          echo "Exit code: $?"

  performance-benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: validation

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq bc sysstat lsof net-tools time

      - name: Make scripts executable
        run: chmod +x health-check.sh

      - name: Benchmark execution time
        run: |
          echo "=== Execution Time Benchmark ==="
          for i in {1..10}; do
            /usr/bin/time -f "%e seconds" ./health-check.sh --quiet 2>&1 | grep seconds
          done

      - name: Benchmark memory usage
        run: |
          echo "=== Memory Usage Benchmark ==="
          /usr/bin/time -v ./health-check.sh --quiet 2>&1 | grep "Maximum resident set size"

      - name: Concurrent execution test
        run: |
          echo "=== Concurrent Execution Test ==="
          for i in {1..5}; do
            ./health-check.sh --quiet &
          done
          wait
          echo "All concurrent executions completed"

      - name: Generate performance report
        run: |
          cat > performance-report.md <<EOF
          # Performance Benchmark Results

          **Date**: $(date -Iseconds)
          **Platform**: Ubuntu Latest (GitHub Actions)

          ## Execution Time
          - Average: $(for i in {1..10}; do /usr/bin/time -f "%e" ./health-check.sh --quiet 2>&1; done | awk '{sum+=$1} END {print sum/NR}') seconds

          ## Memory Usage
          - Peak RSS: $(/usr/bin/time -v ./health-check.sh --quiet 2>&1 | grep "Maximum resident set size" | awk '{print $6}') KB

          ## Concurrent Safety
          - ✅ 5 concurrent executions completed successfully
          EOF
          cat performance-report.md

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: performance-report.md
          retention-days: 90

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: shellcheck

    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets in code
        run: |
          echo "=== Checking for potential secrets ==="
          ! grep -rE '(password|secret|token|api_key)\s*=' *.sh || exit 1

      - name: Verify no root execution
        run: |
          chmod +x health-check.sh
          sudo ./health-check.sh 2>&1 | grep -q "must NOT be run as root"

      - name: Check sudo commands
        run: |
          echo "=== Auditing sudo usage ==="
          grep -n "sudo" health-check.sh | grep -v "^#" || echo "No sudo found (expected)"

      - name: Verify temp file security
        run: |
          echo "=== Checking temp file handling ==="
          grep -n "mktemp" health-check.sh
          ! grep -n "chmod 777" health-check.sh

      - name: Check for command injection vulnerabilities
        run: |
          echo "=== Checking for command injection risks ==="
          ! grep -E 'eval.*\$' health-check.sh || exit 1

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: comprehensive-tests

    services:
      prometheus:
        image: prom/prometheus:latest
        ports:
          - 9090:9090

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq bc sysstat lsof net-tools curl

      - name: Make scripts executable
        run: chmod +x health-check.sh

      - name: Test Prometheus export
        run: |
          ./health-check.sh --format prometheus > health.prom
          cat health.prom
          grep -q "system_health_score" health.prom

      - name: Test JSON output piping
        run: |
          ./health-check.sh --json | jq -e '.score'
          ./health-check.sh --json | jq -e '.metrics.cpu'
          ./health-check.sh --json | jq -e '.metrics.memory'

      - name: Test cron compatibility
        run: |
          # Simulate cron environment (no TTY)
          env -i PATH=/usr/bin:/bin ./health-check.sh --quiet

      - name: Test file output
        run: |
          ./health-check.sh --json --output /tmp/health-test.json
          test -f /tmp/health-test.json
          jq . /tmp/health-test.json

  release-validation:
    name: Release Validation
    runs-on: ubuntu-latest
    needs: [validation, comprehensive-tests, security-audit, performance-benchmarks]
    if: github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Verify version tag
        run: |
          VERSION=$(grep "readonly SCRIPT_VERSION=" health-check.sh | cut -d'"' -f2)
          echo "Script version: $VERSION"

      - name: Check changelog
        run: |
          grep -q "$VERSION" README.md || (echo "Version not in README"; exit 1)

      - name: Verify all documentation
        run: |
          test -f README.md
          test -f CLAUDE.md
          test -f PRODUCTION_RUNBOOK.md
          test -f DEPLOYMENT_CHECKLIST.md
          test -f health-check.1

      - name: Create release artifact
        run: |
          mkdir -p release
          cp health-check.sh release/
          cp validate-deployment.sh release/
          cp README.md release/
          cp PRODUCTION_RUNBOOK.md release/
          cp DEPLOYMENT_CHECKLIST.md release/
          cp health-check.1 release/
          tar -czf health-check-$VERSION.tar.gz release/

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: health-check-*.tar.gz
          retention-days: 365

  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [release-validation]
    if: always()

    steps:
      - name: Report status
        run: |
          if [ "${{ needs.release-validation.result }}" == "success" ]; then
            echo "✅ All CI/CD checks passed!"
          else
            echo "❌ Some CI/CD checks failed"
            exit 1
          fi
